name: Rename video #55 file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename video file
        run: |
          git config user.name "kingsoft2109"
          git config user.email "kingsoft2109@users.noreply.github.com"
          git mv assets/assets-video-handan-kettei-suru.mp4 assets/video-handan-kettei-suru.mp4
          git commit -m "Rename assets-video-handan-kettei-suru.mp4 to video-handan-kettei-suru.mp4"
          git push
