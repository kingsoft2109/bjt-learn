name: Rename video #57 file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename video file
        run: |
          git config user.name "kingsoft2109"
          git config user.email "kingsoft2109@users.noreply.github.com"
          git mv assets/bjt-nittei-no-chosei.mp4 assets/video-nittei-no-chosei.mp4
          git commit -m "Rename bjt-nittei-no-chosei.mp4 to video-nittei-no-chosei.mp4"
          git push
