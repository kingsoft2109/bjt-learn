<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>スーパー日本語 BJT Standard Vol.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --bg:#eef0ee;--card:#ffffff;--ink:#1c2321;--muted:#5c6862;--line:#d8ded9;
  --navy:#14365e;--navy2:#0f2a4a;--accent:#c2410c;--ok:#15803d;--okbg:#dcfce7;
  --chip:#eef2f6;--hover:#f5f7f5;--expand-bg:#f8faf8;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#101312;--card:#1b211f;--ink:#edf2ef;--muted:#a8b5ae;--line:#2e3834;
    --navy:#7fb0e6;--navy2:#a9cbf2;--chip:#242e2a;--hover:#232a27;--expand-bg:#1e2522;
    --okbg:#123524;--accent:#ef6c33;}
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro","Noto Sans JP",system-ui,sans-serif;line-height:1.6}
.jp{font-family:"Noto Sans JP","Be Vietnam Pro",sans-serif}
a{color:var(--navy);text-decoration:none}
a:hover{text-decoration:underline}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:var(--navy2);color:#fff;padding:0 20px;display:flex;align-items:center;gap:14px;min-height:56px;flex-wrap:wrap}
@media(prefers-color-scheme:dark){.topbar{background:#16283f}}
.topbar .back{color:rgba(255,255,255,.75);font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px;flex-shrink:0}
.topbar .back:hover{color:#fff;text-decoration:none}
.topbar .back svg{width:18px;height:18px}
.brand{font-weight:800;font-size:15px;letter-spacing:.02em;white-space:nowrap}

/* layout */
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}

/* hero */
.hero{text-align:center;padding:28px 0 8px}
.hero h1{font-size:clamp(22px,4vw,32px);font-weight:800;line-height:1.3}
.hero h1 .jp{display:block;font-size:clamp(18px,3.2vw,24px);font-weight:700;color:var(--muted);margin-top:2px}
.hero p{color:var(--muted);font-size:14px;margin-top:6px}

/* section heading */
.section-title{font-size:20px;font-weight:800;margin:32px 0 14px;padding-left:12px;border-left:4px solid var(--accent);line-height:1.3}

/* card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}

/* card */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:var(--navy)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none;gap:10px}
.card-head h3{font-size:15px;font-weight:700;margin:0}
.card-head .meta{font-size:12.5px;color:var(--muted);white-space:nowrap}
.card-head .arrow{width:20px;height:20px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.card.open .card-head .arrow{transform:rotate(180deg)}

.card-body{display:none;padding:0 18px 16px;border-top:1px solid var(--line)}
.card.open .card-body{display:block}

/* question grid inside card */
.q-section{margin-top:12px}
.q-section .q-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.q-grid{display:flex;flex-wrap:wrap;gap:8px}
.q-link{display:inline-flex;align-items:center;gap:4px;padding:7px 13px;border-radius:8px;background:var(--chip);font-size:13.5px;font-weight:600;color:var(--ink);transition:background .12s}
.q-link:hover{background:var(--navy);color:#fff;text-decoration:none}
.q-link .audio-icon{font-size:12px}

.answer-link{display:inline-flex;align-items:center;gap:5px;margin-top:12px;padding:8px 16px;border-radius:8px;background:var(--okbg);color:var(--ok);font-size:13.5px;font-weight:700}
.answer-link:hover{text-decoration:none;filter:brightness(.9)}

/* responsive */
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .wrap{padding:16px 12px 48px}
}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="../index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    BJT
  </a>
  <div class="brand">Super Nihongo</div>
</div>

<div class="wrap">
  <div class="hero">
    <h1>
      Super Nihongo BJT Standard Vol.2
      <span class="jp">スーパー日本語 BJT Standard Vol.2</span>
    </h1>
    <p>Weekly drills &amp; practice tests</p>
  </div>

  <h2 class="section-title jp">週間ドリル <span style="font-size:14px;font-weight:400;color:var(--muted)">Weekly Drills</span></h2>
  <div class="grid" id="weeks-grid"></div>

  <h2 class="section-title jp">テスト <span style="font-size:14px;font-weight:400;color:var(--muted)">Practice Tests</span></h2>
  <div class="grid" id="tests-grid"></div>
</div>

<script>
// Data: verified against actual files on disk
const DATA = {
  weeks: [
    {n:1, questions:9, audioMax:5, answerFile:"week1_answer.htm"},
    {n:2, questions:13, audioMax:8, answerFile:"week2_answer.htm"},
    {n:3, questions:13, audioMax:8, answerFile:"week3_answer.htm"},
    {n:4, questions:13, audioMax:8, answerFile:"week4_answer.htm"},
    {n:5, questions:13, audioMax:8, answerFile:"week5_answer.htm"},
    {n:6, questions:13, audioMax:8, answerFile:"week6_answer.htm"},
    {n:7, questions:13, audioMax:8, answerFile:"week7_answer.htm"},
    {n:8, questions:13, audioMax:8, answerFile:"week8_answer.htm"},
    {n:9, questions:13, audioMax:8, answerFile:"week9_answer.htm"},
    {n:10, questions:16, audioMax:10, answerFile:"week10_answer.htm"},
    {n:11, questions:16, audioMax:10, answerFile:"week11_answer.htm"},
    {n:12, questions:17, audioMax:10, answerFile:"week12_anwser.htm"},
  ],
  tests: [
    {n:1, questions:16, audioMax:10, answerFile:"test1_answer.htm"},
    {n:2, questions:16, audioMax:10, answerFile:"test2_answer.htm"},
    {n:3, questions:24, audioMax:0, answerFile:null},
  ]
};

const SECTIONS_LISTENING = [
  {label:"第1部 S1 描写問題", from:1, to:1},
  {label:"第1部 S2 表現力問題", from:2, to:2},
  {label:"第1部 S3 聴解問題", from:3, to:3},
  {label:"第2部 S1 描写問題", from:4, to:4},
  {label:"第2部 S2 聴読解問題", from:5, to:5},
];

function buildCard(type, item) {
  const prefix = type === "week" ? `week${item.n}` : `test${item.n}`;
  const dir = type === "week" ? `week_${item.n}` : `test_${item.n}`;
  const title = type === "week" ? `第${item.n}週` : `テスト ${item.n}`;
  const sub = type === "week" ? `Week ${item.n}` : `Test ${item.n}`;
  const audioCount = item.audioMax;
  const totalQ = item.questions;

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-head" onclick="this.parentElement.classList.toggle('open')">
      <div>
        <h3 class="jp">${title} <span style="font-size:12px;font-weight:400;color:var(--muted)">${sub}</span></h3>
      </div>
      <span class="meta">${totalQ}問</span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="card-body">
      ${audioCount > 0 ? `<div class="q-section">
        <div class="q-label jp">聴解 Listening (Q1-${audioCount})</div>
        <div class="q-grid">${buildLinks(dir, prefix, 1, audioCount, true)}</div>
      </div>` : ""}
      <div class="q-section">
        <div class="q-label jp">読解 Reading (Q${audioCount+1}-${totalQ})</div>
        <div class="q-grid">${buildLinks(dir, prefix, audioCount+1, totalQ, false)}</div>
      </div>
      ${item.answerFile ? `<a class="answer-link" href="${dir}/${item.answerFile}">&#x1F4D6; 解答・解説</a>` : ""}
    </div>`;
  return card;
}

function buildLinks(dir, prefix, from, to, hasAudio) {
  let html = "";
  for (let i = from; i <= to; i++) {
    const audio = hasAudio ? ' <span class="audio-icon">&#x1F3A7;</span>' : "";
    html += `<a class="q-link" href="${dir}/${prefix}_${i}.htm">Q${i}${audio}</a>`;
  }
  return html;
}

// Render
const weeksGrid = document.getElementById("weeks-grid");
DATA.weeks.forEach(w => weeksGrid.appendChild(buildCard("week", w)));

const testsGrid = document.getElementById("tests-grid");
DATA.tests.forEach(t => testsGrid.appendChild(buildCard("test", t)));
</script>
</body>
</html>
